<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#3F7A52">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ستاد مرکزی 👑</title>
<script src="/assets/api.js"></script>
<style>
:root{--bg:#eef5ec;--surface:#fff;--ink:#26332b;--soft:#6b7a6f;--leaf:#3f7a52;--leaf-pale:#e3f0e6;--sun:#f6c445;--coral:#e2725b;--line:#e3e8e0;--shadow:0 6px 18px rgba(38,51,43,.08)}
*{box-sizing:border-box}
body{margin:0;font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:860px;margin:0 auto;padding:14px 14px 60px}
.top{display:flex;align-items:center;gap:10px;padding:10px 0}
h1{font-size:1.15rem;margin:0}
.sp{flex:1}
.btn{background:var(--leaf);color:#fff;border:none;border-radius:12px;padding:10px 16px;font-weight:800;cursor:pointer;font-family:inherit;font-size:.8rem}
.btn:active{transform:scale(.95)}
.ghost{background:var(--surface);color:var(--coral);border:2px solid var(--line)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:.75rem;font-weight:800;box-shadow:var(--shadow)}
.card{background:var(--surface);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:.9rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid label{font-size:.66rem;font-weight:800;color:var(--soft)}
.grid input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px;font-family:inherit;font-size:.8rem;background:var(--bg)}
.row{background:var(--surface);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row .main{flex:1;min-width:200px}
.row .t{font-weight:800;font-size:.88rem}
.row .meta{color:var(--soft);font-size:.68rem;margin-top:3px}
.badge{border-radius:999px;padding:3px 10px;font-size:.65rem;font-weight:800}
.on{background:var(--leaf-pale);color:var(--leaf)}
.off{background:#fdecd8;color:var(--coral)}
.toast{position:fixed;bottom:24px;right:50%;transform:translateX(50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:.8rem;font-weight:800;opacity:0;transition:.25s;z-index:99;pointer-events:none}
.toast.show{opacity:1}
</style>
<script src="/assets/install-pwa.js" defer></script>

<style>

/* =========================================================
   STAGE 20 — SUPER ADMIN DASHBOARD REDESIGN
   UI/UX polish only — no data/API behavior changes
   ========================================================= */

:root {
  --super-shadow: 0 8px 26px rgba(38,51,43,.07);
  --super-shadow-hover: 0 12px 30px rgba(38,51,43,.11);
}

.wrap {
  max-width: 1040px;
}

.top {
  position: sticky;
  top: 0;
  z-index: 20;
  padding: 10px 0 14px;
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.card,
.row {
  border: 1px solid color-mix(in srgb, var(--line) 82%, transparent);
  box-shadow: var(--super-shadow);
}

.card:hover,
.row:hover {
  box-shadow: var(--super-shadow-hover);
}

#stats {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 9px;
}

#stats .chip {
  border-radius: 14px;
  padding: 11px 10px;
  text-align: center;
}

.row {
  border-radius: 17px;
}

@media (max-width: 700px) {
  .wrap {
    padding: 10px 9px 35px;
  }

  #stats {
    grid-template-columns: repeat(2, 1fr);
  }

  .row {
    align-items: flex-start;
  }

  .row .main {
    min-width: 100%;
  }

  .row > div:last-child {
    width: 100%;
  }

  .row > div:last-child .btn {
    flex: 1;
  }

  .row > div:last-child {
    display: flex;
  }
}

@media (max-width: 430px) {
  #stats {
    grid-template-columns: 1fr 1fr;
  }

  .row > div:last-child {
    flex-direction: column;
  }

  .row > div:last-child .btn {
    width: 100%;
  }
}

</style>

<!-- ===== REAL DASHBOARD REDESIGN ===== -->
<style id="real-dashboard-redesign">

:root{
  --rd-bg:#f4f7f4;
  --rd-card:#ffffff;
  --rd-text:#26332b;
  --rd-muted:#718075;
  --rd-line:#e3e9e3;
  --rd-green:#3f7a52;
  --rd-green-soft:#edf5ef;
  --rd-radius:20px;
  --rd-shadow:0 8px 28px rgba(30,55,38,.08);
}

/* ---------- پایه ---------- */

html{
  scroll-behavior:smooth;
}

body{
  background:var(--rd-bg) !important;
  color:var(--rd-text);
}

button,
input,
select,
textarea{
  font-family:inherit;
}

/* ---------- کارت‌های اصلی ---------- */

.card,
.stat-card,
.dashboard-card,
.panel,
.section-card,
.report-card{
  border-radius:var(--rd-radius) !important;
  border-color:var(--rd-line) !important;
  box-shadow:var(--rd-shadow);
}

/* ---------- تیتر بخش ---------- */

section > h2,
section > h3{
  letter-spacing:-.2px;
}

/* ---------- دکمه‌ها ---------- */

.btn,
.primary-btn,
.secondary-btn,
button{
  border-radius:11px;
}

/* ---------- جدول ---------- */

table{
  border-collapse:separate;
  border-spacing:0;
  overflow:hidden;
}

th{
  background:#f7faf7;
}

th,
td{
  border-bottom:1px solid var(--rd-line);
}

/* ---------- موبایل ---------- */

@media(max-width:760px){

  body{
    overflow-x:hidden;
  }

  .card,
  .stat-card,
  .dashboard-card,
  .panel,
  .section-card,
  .report-card{
    border-radius:17px !important;
  }

  button,
  .btn{
    min-height:40px;
  }
}


/* ==================================================
   STUDENT
   ================================================== */

body[data-dashboard="student"] .rd-student-only{
  display:block;
}

/* باغچه باید قهرمان صفحه باشد */

.sprout-wrap{
  position:relative;
  transition:transform .25s ease,filter .25s ease;
}

.sprout-wrap:hover{
  transform:translateY(-2px);
}


/* ==================================================
   TEACHER
   ================================================== */

body[data-dashboard="teacher"] .rd-teacher-only{
  display:block;
}

/* مرکز اقدامات */

#actionCenterSection,
#teacherActionCenter,
#actionCenter{
  border-radius:22px !important;
}

/* کارت‌های اقدام */

#actionCenterSection .card,
#teacherActionCenter .card,
#actionCenter .card{
  transition:transform .18s ease,box-shadow .18s ease;
}

#actionCenterSection .card:hover,
#teacherActionCenter .card:hover,
#actionCenter .card:hover{
  transform:translateY(-2px);
}


/* ==================================================
   PARENT
   ================================================== */

body[data-dashboard="parent"] .rd-parent-only{
  display:block;
}


/* ==================================================
   ADMIN
   ================================================== */

body[data-dashboard="admin"] .rd-admin-only{
  display:block;
}


/* ==================================================
   SUPER ADMIN
   ================================================== */

body[data-dashboard="super"] .rd-super-only{
  display:block;
}


/* ==================================================
   GLOBAL RESPONSIVE GRID
   ================================================== */

@media(max-width:900px){

  [style*="grid-template-columns:repeat(4"],
  [style*="grid-template-columns: repeat(4"]{
    grid-template-columns:repeat(2,1fr) !important;
  }

  [style*="grid-template-columns:repeat(5"],
  [style*="grid-template-columns: repeat(5"]{
    grid-template-columns:repeat(2,1fr) !important;
  }
}

@media(max-width:560px){

  [style*="grid-template-columns:repeat(3"],
  [style*="grid-template-columns: repeat(3"],
  [style*="grid-template-columns:repeat(4"],
  [style*="grid-template-columns: repeat(4"],
  [style*="grid-template-columns:repeat(5"],
  [style*="grid-template-columns: repeat(5"]{
    grid-template-columns:1fr 1fr !important;
  }
}

</style>

<style id="real-super-dashboard">

body{
  background:
    radial-gradient(circle at 90% 0%,#e9f0eb 0,transparent 30%),
    var(--rd-bg) !important;
}

/* هدر مرکزی */

.super-header,
.super-topbar,
.topbar{
  border-radius:22px !important;
}

/* KPI کل سامانه */

.super-stat,
.system-stat,
.stat-card{
  border-radius:18px !important;
  box-shadow:var(--rd-shadow);
}

/* ساخت مدرسه */

.create-school,
.create-form{
  border-radius:22px !important;
}

/* کارت مدرسه */

.school-card{
  border-radius:19px !important;
  transition:transform .18s ease,box-shadow .18s ease;
}

.school-card:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 30px rgba(30,55,38,.10);
}

/* عملیات خطرناک */

button.danger,
.danger-btn{
  border-radius:10px;
}

</style>

</head>
<body>
<div class="wrap">
<header class="top">
  <h1>👑 ستاد مرکزی</h1>
  <div class="sp"></div>
  <button class="btn ghost" onclick="logout()">🚪 خروج</button>
</header>
<div class="chips" id="stats"></div>
<section class="card">
  <h3>🏫 ساخت مدرسهٔ جدید + مدیر</h3>
  <div class="grid">
    <div><label>نام مدرسه</label><input id="cName"></div>
    <div><label>شهر</label><input id="cCity"></div>
    <div><label>نام مدیر</label><input id="cFull"></div>
    <div><label>نام کاربری مدیر</label><input id="cUser"></div>
    <div style="grid-column:1/-1"><label>رمز عبور مدیر (حداقل ۸)</label><input id="cPass" type="password"></div>
  </div>
  <button class="btn" style="width:100%;margin-top:10px" onclick="createSchool()">＋ ساخت مدرسه</button>
</section>
<h3 style="font-size:.95rem">🏫 مدرسه‌های سامانه</h3>
<div id="schools"></div>
</div>
<div class="toast" id="toast"></div>
<script>
const user = requireAuth(['admin']);
if (user && !user.isSuper) window.location.href = 'login.html';
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1900);}
function logout(){Auth.clear();window.location.href='login.html';}
const toFa=n=>String(n==null?'—':n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const escAttr=s=>String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
async function load(){
  try{
    const [st, sc] = await Promise.all([apiFetch('/super/stats'), apiFetch('/super/list-schools')]);
    const s=st.stats;
    document.getElementById('stats').innerHTML=`<div class="chip">🏫 ${toFa(s.schools)} مدرسه</div><div class="chip">👩‍🏫 ${toFa(s.teachers)} معلم</div><div class="chip">🧒 ${toFa(s.students)} دانش‌آموز</div><div class="chip">📚 ${toFa(s.questions)} سؤال</div><div class="chip">📝 ${toFa(s.assignments)} تکلیف</div>`;
    document.getElementById('schools').innerHTML=(sc.schools||[]).map(x=>`
      <div class="row">
        <div class="main"><div class="t">🏫 ${x.name} ${x.enabled?'<span class="badge on">فعال</span>':'<span class="badge off">غیرفعال</span>'}</div>
        <div class="meta">${x.city||''} · 👩‍🏫 ${toFa(x.teacher_count)} معلم · 🧒 ${toFa(x.student_count)} دانش‌آموز · ساخته: ${x.created_at?x.created_at.slice(0,10):'—'}</div></div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="btn ${x.enabled?'ghost':''}" onclick="toggle(${x.id},${x.enabled?0:1})">${x.enabled?'⛔ غیرفعال':'✅ فعال'}</button>
          <button class="btn ghost" onclick="resetAdminPassword(${x.id},'${escAttr(x.name)}')">🔑 ریست رمز</button>
          <button class="btn ghost" style="border-color:var(--coral)" onclick="deleteSchool(${x.id},'${escAttr(x.name)}')">🗑️ حذف مدرسه</button>
        </div>
      </div>`).join('')||'<p style="color:var(--soft)">مدرسه‌ای نیست.</p>';
  }catch(e){toast('خطا: '+e.message);}
}
async function createSchool(){
  const g=id=>document.getElementById(id).value;
  try{
    await apiFetch('/super/create-school',{method:'POST',body:{schoolName:g('cName'),city:g('cCity'),adminFullName:g('cFull'),adminUsername:g('cUser'),adminPassword:g('cPass')}});
    toast('مدرسه ساخته شد 🏫');['cName','cCity','cFull','cUser','cPass'].forEach(id=>document.getElementById(id).value='');load();
  }catch(e){toast('خطا: '+e.message);}
}
async function toggle(id,en){
  try{await apiFetch('/super/toggle-school',{method:'POST',body:{schoolId:id,enable:!!en}});toast(en?'مدرسه فعال شد ✅':'مدرسه غیرفعال شد ⛔');load();}catch(e){toast('خطا: '+e.message);}
}
async function resetAdminPassword(schoolId,schoolName){
  try{
    const res=await apiFetch('/super/list-school-admins?schoolId='+schoolId);
    const admins=res.admins||[];
    if(admins.length===0){toast('این مدرسه مدیری ندارد');return;}
    let target=admins[0];
    if(admins.length>1){
      const list=admins.map(a=>a.username).join('، ');
      const picked=prompt(`مدرسهٔ «${schoolName}» چند مدیر دارد: ${list}\nنام کاربری مدیر مورد نظر رو تایپ کن:`);
      if(picked===null)return;
      target=admins.find(a=>a.username===picked.trim());
      if(!target){toast('نام کاربری پیدا نشد');return;}
    }
    const pass=prompt(`رمز جدید برای «${target.username}» (مدیر «${schoolName}») — حداقل ۸ کاراکتر:`);
    if(pass===null)return;
    if(pass.length<8){toast('رمز باید حداقل ۸ کاراکتر باشد');return;}
    await apiFetch('/super/reset-school-admin-password',{method:'POST',body:{adminId:target.id,newPassword:pass}});
    toast('رمز «'+target.username+'» ریست شد ✅');
  }catch(e){toast('خطا: '+e.message);}
}
async function deleteSchool(schoolId,schoolName){
  const typed=prompt(`⚠️ حذف کامل «${schoolName}» غیرقابل بازگشت است — همهٔ کلاس‌ها، معلم‌ها، دانش‌آموزان، تکالیف و اطلاعات این مدرسه پاک می‌شود.\nبرای تأیید، نام دقیق مدرسه رو تایپ کن:`);
  if(typed===null)return;
  if(typed.trim()!==schoolName){toast('نام مطابقت نداشت، حذف لغو شد');return;}
  try{
    await apiFetch('/super/delete-school',{method:'POST',body:{schoolId,confirmName:typed.trim()}});
    toast('مدرسه «'+schoolName+'» حذف شد 🗑️');load();
  }catch(e){toast('خطا: '+e.message);}
}
if(user)load();
</script>
</body>
</html>
