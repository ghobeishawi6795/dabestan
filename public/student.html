<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>داشبورد دانش‌آموز — باغچهٔ درس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  .toast-mini { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: .82rem; font-weight: 700; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 60; }
  .toast-mini.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }
  @media (max-width: 900px) { .toast-mini { bottom: 84px; } }
</style>
</head>
<body>
<div class="app-shell">

  <aside class="sidebar">
    <div class="brand"><span class="leaf-badge">🌱</span> باغچهٔ درس</div>
    <ul class="nav-list">
      <li><a class="nav-item active" href="#top" onclick="scrollToId('top')"><span class="ic">🏠</span> خانه</a></li>
      <li><a class="nav-item" href="#tasksSection" onclick="scrollToId('tasksSection')"><span class="ic">📋</span> تکالیف من</a></li>
      <li><a class="nav-item" href="#sproutSection" onclick="scrollToId('sproutSection')"><span class="ic">🌻</span> باغچهٔ من</a></li>
      <li><a class="nav-item" href="#" onclick="comingSoon(event)"><span class="ic">🏆</span> نشان‌ها</a></li>
      <li><a class="nav-item" href="#" onclick="comingSoon(event)"><span class="ic">👤</span> پروفایل</a></li>
    </ul>
    <div class="sidebar-foot">
      <div class="role-switch">
        <span id="whoami"></span>
        <a href="#" onclick="logout()">خروج از حساب ←</a>
      </div>
    </div>
  </aside>

  <main class="main" id="top">
    <div class="topbar">
      <div class="greeting">
        <div class="avatar-circle">🐣</div>
        <div><h1 id="greetTitle">سلام!</h1><p id="greetSub"></p></div>
      </div>
      <div class="streak-chip">🔥 <span id="streakNum">۰</span> روز پیاپی</div>
    </div>

    <section class="sprout-panel" id="sproutSection">
      <div class="sprout-wrap" title="نهالت رو لمس کن">
        <svg viewBox="0 0 128 128" fill="none">
          <ellipse cx="64" cy="116" rx="34" ry="7" fill="#2A5238" opacity=".25"/>
          <path d="M64 116 C64 80 64 60 64 40" stroke="#3F7A52" stroke-width="6" stroke-linecap="round"/>
          <path d="M64 70 C40 68 34 50 40 34 C58 40 64 54 64 70Z" fill="#5B9E6E"/>
          <path d="M64 58 C88 54 96 36 90 20 C70 28 62 44 64 58Z" fill="#3F7A52"/>
          <circle cx="64" cy="30" r="17" fill="#F6C453"/>
          <circle cx="58" cy="27" r="2.6" fill="#21351F"/>
          <circle cx="70" cy="27" r="2.6" fill="#21351F"/>
          <path d="M58 35 Q64 40 70 35" stroke="#21351F" stroke-width="2.4" stroke-linecap="round" fill="none"/>
          <circle cx="52" cy="32" r="3" fill="#E8734A" opacity=".55"/>
          <circle cx="76" cy="32" r="3" fill="#E8734A" opacity=".55"/>
        </svg>
      </div>
      <div class="sprout-title" id="sproutStage">—</div>
      <div class="sprout-sub" id="sproutSub"></div>
      <div class="sprout-progress"><div id="sproutBar" style="width:0%"></div></div>
    </section>

    <div class="section-head" id="tasksSection"><h2>کارهای امروز</h2><a class="see-all" href="#tasksSection">همه ↓</a></div>
    <div class="task-scroll" id="taskScroll">
      <div class="task-card">در حال بارگذاری...</div>
    </div>

    <div class="section-head"><h2>پیشرفت این هفته</h2></div>
    <div class="grid grid-3" id="statsGrid">
      <div class="card card-stat"><div class="num" id="statDone">۰</div><div class="label">تکلیف انجام‌شده</div></div>
      <div class="card card-stat"><div class="num" id="statScore">—</div><div class="label">میانگین درصد</div></div>
      <div class="card card-stat"><div class="num" id="statStreak">۰</div><div class="label">روز پیاپی</div></div>
    </div>
  </main>
</div>

<nav class="bottom-nav">
  <a class="active" href="#top" onclick="scrollToId('top')"><span class="ic">🏠</span>خانه</a>
  <a href="#tasksSection" onclick="scrollToId('tasksSection')"><span class="ic">📋</span>تکالیف</a>
  <a href="#sproutSection" onclick="scrollToId('sproutSection')"><span class="ic">🌻</span>باغچه</a>
  <a href="#" onclick="comingSoon(event)"><span class="ic">👤</span>پروفایل</a>
</nav>

<div class="toast-mini" id="toastMini"></div>

<script src="assets/api.js"></script>
<script>
  const user = requireAuth(['student']);
  if (user) {
    document.getElementById('whoami').textContent = `${user.fullName} (دانش‌آموز)`;
    document.getElementById('greetTitle').textContent = `سلام ${user.fullName}!`;
    loadAll();
  }

  function logout() { Auth.clear(); window.location.href = 'login.html'; }

  function scrollToId(id) {
    document.getElementById(id)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  let toastTimer;
  function comingSoon(e) {
    e.preventDefault();
    const t = document.getElementById('toastMini');
    t.textContent = 'این بخش به‌زودی اضافه می‌شه 🌱';
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
  }

  // مراحل رشد نهال بر اساس امتیاز — صرفاً برای نمایش
  const STAGES = [
    { min: 0, name: 'دانه', icon: '🌰' },
    { min: 30, name: 'جوانه‌زن', icon: '🌱' },
    { min: 80, name: 'غنچه', icon: '🌿' },
    { min: 150, name: 'شکوفا', icon: '🌸' },
    { min: 250, name: 'درخت پربار', icon: '🌳' },
  ];
  function stageFor(points) {
    let current = STAGES[0], next = STAGES[1];
    for (let i = 0; i < STAGES.length; i++) {
      if (points >= STAGES[i].min) current = STAGES[i];
      if (points < STAGES[i].min) { next = STAGES[i]; break; }
      next = null;
    }
    return { current, next };
  }

  // نگاشت نوع سؤال به آیکون/رنگ کارت تکلیف — مطابق طرح اولیه
  const TYPE_ICON = {
    audio_record: '🎤', photo_upload: '📷', drawing: '✏️', coloring: '🎨',
    matching: '🧩', ordering: '🔢', drag_connect: '🔗',
    multiple_choice: '❓', true_false: '❓', fill_blank: '✍️', custom_html: '✨',
  };
  const TYPE_CLASS = {
    audio_record: 't-audio', photo_upload: 't-photo', drawing: 't-draw', coloring: 't-color',
    matching: 't-match', ordering: 't-match', drag_connect: 't-connect',
    multiple_choice: 't-match', true_false: 't-match', fill_blank: 't-draw', custom_html: 't-connect',
  };

  async function loadAll() {
    try {
      const tasksData = await apiFetch('/student/get-tasks');
      renderGrowth(user.growthPoints ?? 0);
      renderTasks(tasksData.assignments);
      document.getElementById('streakNum').textContent = toFa(tasksData.streak);
      document.getElementById('statStreak').textContent = toFa(tasksData.streak);
      document.getElementById('statDone').textContent = toFa(tasksData.doneCount);
      document.getElementById('statScore').textContent = tasksData.avgScore !== null ? `٪${toFa(tasksData.avgScore)}` : '—';
      document.getElementById('greetSub').textContent = tasksData.assignments.some(a => !a.submission_status || a.submission_status === 'in_progress')
        ? `امروز ${toFa(tasksData.assignments.filter(a => !a.submission_status || a.submission_status === 'in_progress').length)} تکلیف منتظرتن`
        : 'همه‌چی رو تموم کردی 🎉';
    } catch (e) { console.error(e); }
  }

  function renderGrowth(points) {
    const { current, next } = stageFor(points);
    document.getElementById('sproutStage').textContent = `نهال تو: «${current.name}» ${current.icon}`;
    if (next) {
      const need = next.min - points;
      document.getElementById('sproutSub').textContent = `${toFa(need)} امتیاز دیگر تا مرحلهٔ «${next.name}»`;
      const span = next.min - current.min;
      const pct = Math.min(100, Math.round(((points - current.min) / span) * 100));
      document.getElementById('sproutBar').style.width = pct + '%';
    } else {
      document.getElementById('sproutSub').textContent = 'به بالاترین مرحله رسیدی! 🎉';
      document.getElementById('sproutBar').style.width = '100%';
    }
  }

  function renderTasks(assignments) {
    const box = document.getElementById('taskScroll');
    if (!assignments.length) { box.innerHTML = '<div class="task-card">فعلاً تکلیفی نداری 🎉</div>'; return; }
    box.innerHTML = assignments.map(a => {
      const done = a.submission_status === 'submitted' || a.submission_status === 'reviewed';
      const icon = TYPE_ICON[a.primary_type] || '📋';
      const cls = TYPE_CLASS[a.primary_type] || 't-match';
      return `
      <a class="task-card" href="task.html?id=${a.id}" style="color:inherit;">
        <div class="task-type-icon ${cls}">${icon}</div>
        <span class="task-badge ${done ? 'badge-done' : 'badge-new'}">${done ? 'انجام شد' : 'جدید'}</span>
        <div class="subject">${escapeHtml(a.title)}</div>
        <div class="due">${a.due_at ? 'تا ' + toFa(a.due_at) : 'بدون موعد'}</div>
      </a>`;
    }).join('');
  }

  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function toFa(n) { return String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]); }
</script>
</body>
</html>
