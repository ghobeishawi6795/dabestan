<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نمای والدین — باغچهٔ درس</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#3F7A52">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="باغچهٔ درس">
<script src="assets/pwa.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  body { display: flex; align-items: flex-start; justify-content: center; padding: 24px 16px; }
  .wrap { max-width: 480px; width: 100%; }
  .code-box { background: var(--surface); border-radius: var(--radius-lg); padding: 26px; box-shadow: var(--shadow); border: 1px solid var(--line); text-align: center; }
  .code-box input { width: 100%; text-align: center; letter-spacing: 4px; font-size: 1.3rem; padding: 14px; border-radius: 12px; border: 2px solid var(--line); font-family: inherit; margin: 14px 0; }
  .msg-err { background: #FDECD8; color: var(--coral-dark); font-size: .85rem; padding: 8px 10px; border-radius: 8px; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <div id="codeScreen" class="code-box">
    <div style="font-size:2rem;">💛</div>
    <h1 style="margin:8px 0 4px;">نمای والدین</h1>
    <p>کد اختصاصی فرزندتون رو وارد کنید</p>
    <div id="codeMsg"></div>
    <input type="text" id="codeInput" placeholder="مثلاً: AB3D7F2K" maxlength="10">
    <button class="btn btn-primary" style="width:100%;" onclick="lookup()">مشاهدهٔ وضعیت</button>
  </div>

  <div id="resultScreen" style="display:none;">
    <section class="sprout-panel">
      <div class="sprout-wrap">
        <svg viewBox="0 0 128 128" fill="none">
          <ellipse cx="64" cy="116" rx="34" ry="7" fill="#2A5238" opacity=".25"/>
          <path d="M64 116 C64 80 64 60 64 40" stroke="#3F7A52" stroke-width="6" stroke-linecap="round"/>
          <path d="M64 70 C40 68 34 50 40 34 C58 40 64 54 64 70Z" fill="#5B9E6E"/>
          <path d="M64 58 C88 54 96 36 90 20 C70 28 62 44 64 58Z" fill="#3F7A52"/>
          <circle cx="64" cy="30" r="17" fill="#F6C453"/>
          <circle cx="58" cy="27" r="2.6" fill="#21351F"/>
          <circle cx="70" cy="27" r="2.6" fill="#21351F"/>
          <path d="M58 35 Q64 40 70 35" stroke="#21351F" stroke-width="2.4" stroke-linecap="round" fill="none"/>
        </svg>
      </div>
      <div class="sprout-title" id="pStage">—</div>
      <div class="sprout-sub" id="pSub"></div>
    </section>

    <div class="grid grid-2" style="margin-top:16px;">
      <div class="card"><h3 id="pName" style="font-size:1rem;"></h3><p id="pClass" style="font-size:.82rem; margin-top:4px;"></p></div>
      <div class="card card-stat"><div class="num" id="pPending">—</div><div class="label">تکلیف انجام‌نشده</div></div>
    </div>

    <div class="section-head"><h2>آخرین تکالیف</h2></div>
    <div class="card" style="padding:0; overflow:hidden;">
      <table class="simple-table">
        <thead><tr><th>تکلیف</th><th>وضعیت</th></tr></thead>
        <tbody id="pTbody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  const STAGES = [
    { min: 0, name: 'دانه', icon: '🌰' }, { min: 30, name: 'جوانه‌زن', icon: '🌱' },
    { min: 80, name: 'غنچه', icon: '🌿' }, { min: 150, name: 'شکوفا', icon: '🌸' },
    { min: 250, name: 'درخت پربار', icon: '🌳' },
  ];
  function stageFor(points) {
    let cur = STAGES[0];
    for (const s of STAGES) if (points >= s.min) cur = s;
    return cur;
  }

  let parentCode = '';

  async function lookup() {
    const code = document.getElementById('codeInput').value.trim();
    if (!code) return;
    parentCode = code;
    document.getElementById('codeMsg').innerHTML = '';
    try {
      const res = await fetch(`/api/parent/get-student?code=${encodeURIComponent(code)}`);
      const data = await res.json();
      if (!res.ok) { document.getElementById('codeMsg').innerHTML = `<div class="msg-err">کد نامعتبره — دوباره چک کن.</div>`; return; }
      render(data);
    } catch { document.getElementById('codeMsg').innerHTML = `<div class="msg-err">خطا در ارتباط با سرور.</div>`; }
  }

  function render(data) {
    document.getElementById('codeScreen').style.display = 'none';
    document.getElementById('resultScreen').style.display = 'block';
    const stage = stageFor(data.student.growthPoints);
    document.getElementById('pStage').textContent = `نهال ${data.student.fullName}: «${stage.name}» ${stage.icon}`;
    document.getElementById('pSub').textContent = `${data.student.schoolName} — ${data.student.className || ''}`;
    document.getElementById('pName').textContent = data.student.fullName;
    document.getElementById('pClass').textContent = data.student.className || '';
    document.getElementById('pPending').textContent = toFa(data.pendingCount);
    const tbody = document.getElementById('pTbody');
    tbody.innerHTML = data.recentSubmissions.length ? data.recentSubmissions.map(s => `
      <tr><td>${escapeHtml(s.title)}<br><span style="font-size:.75em;color:var(--ink-soft);">معلم: ${escapeHtml(s.teacherName)}</span></td>
      <td>${statusPill(s)}${s.status === 'reviewed' ? ratingWidget(s) : ''}</td></tr>`).join('') : '<tr><td colspan="2">هنوز تکلیفی ثبت نشده.</td></tr>';
  }

  function ratingWidget(s) {
    if (s.myRating) {
      return `<div style="margin-top:6px; font-size:.85em;">${'⭐'.repeat(s.myRating)}${'☆'.repeat(5 - s.myRating)}</div>`;
    }
    return `<div style="margin-top:6px;">
      <span style="font-size:.75em; color:var(--ink-soft);">به این تعامل امتیاز بده:</span><br>
      ${[1,2,3,4,5].map(n => `<button type="button" onclick="rate(${s.submissionId}, ${n}, this)" style="background:none; border:none; font-size:1.2em; cursor:pointer; padding:2px;">☆</button>`).join('')}
    </div>`;
  }

  async function rate(submissionId, stars, btn) {
    try {
      await fetch('/api/parent/submit-feedback', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code: parentCode, submissionId, rating: stars }),
      });
      const row = btn.closest('div');
      row.innerHTML = `${'⭐'.repeat(stars)}${'☆'.repeat(5 - stars)} — ممنون از نظرت!`;
    } catch { /* best-effort */ }
  }

  function statusPill(s) {
    if (s.status === 'reviewed') return `<span class="pill pill-ok">بررسی‌شده — ٪${toFa(s.score ?? 0)}</span>`;
    if (s.status === 'submitted') return `<span class="pill pill-warn">در انتظار بررسی معلم</span>`;
    return `<span class="pill pill-idle">در حال انجام</span>`;
  }

  function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function toFa(n) { return String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]); }
</script>
</body>
</html>
